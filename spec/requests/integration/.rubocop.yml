# Integration test scoped rubocop config.
#
# Integration tests exercise full request pipelines with Arrange/Act/Assert
# structure. They are naturally longer than unit tests, require multiple
# assertions (response + DB state), and may group multiple endpoints in
# one file when thematically linked.

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleDescribes:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

# Integration tests pin numeric response/DB contracts with `eql` so a float-vs-int
# serializer regression (100 vs 100.0) fails loudly. RSpec/BeEql would push these to
# `be`, which is identity-based and reserved for true/false/nil. Disable the conflict.
RSpec/BeEql:
  Enabled: false
