# Shared RuboCop config for specs written in the request-test style.
#
# Goal: Reliable (not flaky) tests that are easy to understand when they fail.
#
# These cops enforce the slice of the request-test rules that static analysis
# can catch. The full ruleset — including the intent-based rules a linter can't
# evaluate — lives in:
#   .claude/skills/request-test-grader/references/request-test-rules.md
#
# This file is inherited from by both spec/requests/.rubocop.yml and
# spec/controllers/.rubocop.yml. Controller specs are being progressively
# converted to request specs (via the `:request` tag and eventual relocation
# to spec/requests/); applying the same discipline to both directories is
# intentional during that migration.

# These specs pin many things in one `it` — response status, individual body
# fields, reloaded DB state — with every asserted value spelled out explicitly
# in setup so the reader can audit cause and effect inline. That naturally runs
# long. Capping example length would push authors to share setup across
# examples or extract helpers, both of which work against keeping each `it`
# independently scannable.
RSpec/ExampleLength:
  Enabled: false

# Same reasoning as ExampleLength: pinning response shape, response values,
# and post-request DB state in one example produces multiple targeted `expect`s
# by design. Each assertion exists to make a distinct failure mode legible.
RSpec/MultipleExpectations:
  Enabled: false

# Neutral — bears on neither reliability nor failure clarity.
RSpec/MultipleDescribes:
  Enabled: false

# Neutral — bears on test examples, not the helpers specs occasionally define.
Metrics/MethodLength:
  Enabled: false

# Neutral — same reasoning as MethodLength.
Metrics/AbcSize:
  Enabled: false

# Neutral — Canvas's request idioms accept long parameter lists (e.g. the
# six-arg `api_call(verb, path, params, body, headers, opts)` helper).
Metrics/ParameterLists:
  Enabled: false

# Numeric response/DB contracts are pinned with `eql` so a float-vs-int
# serializer regression (100 vs 100.0) fails loudly — `eq` would silently
# accept it. RSpec/BeEql would autocorrect those assertions to `be`, which
# is identity-based and reserved for true/false/nil. Disable the conflict so
# the type-tightness of the assertion survives the linter.
RSpec/BeEql:
  Enabled: false

# Bans `before`/`let`/`subject` declared in a nested example group when an
# ancestor already declares one. Nested setup forces the reader to compose
# state outside-in across ancestors to understand what an `it` actually
# exercises, and composition errors don't point at any single hook — both
# directly working against keeping each `it` independently scannable.
Specs/NoNestedSetup:
  Enabled: true

# Standardizes response-body access on `response.parsed_body`. Uniform body
# assertions read the same across the suite, and failure messages don't vary
# by which JSON parser the test author reached for.
Rails/ResponseParsedBody:
  Enabled: true
  AutoCorrect: true

# Symbolic statuses (`:ok`, `:unauthorized`) name the contract the endpoint
# is asserting, and the matcher's failure message names both expected and
# actual codes — better failure clarity than a numeric literal mismatch.
RSpecRails/HttpStatus:
  Enabled: true
  EnforcedStyle: symbolic

# `have_http_status(...)` produces a failure message that names the expected
# and actual status codes. `response.successful?` / `response.status == ...`
# fail with bare true/false or an integer mismatch — the reader has to run
# the test again or open the spec to learn anything.
RSpecRails/HaveHttpStatus:
  Enabled: true
  AutoCorrect: true

# RSpec matchers produce structured failure messages naming expected vs.
# actual; minitest `assert_equal` produces weaker diffs. Converting gets
# uniformly better failure output.
RSpecRails/MinitestAssertions:
  Enabled: true
  AutoCorrect: true

# Pushes `expect(course.reload).to be_available` toward
# `expect(course.reload.workflow_state).to eq("available")` — when the
# assertion fails, the message shows the actual value that differed instead
# of just true/false. `EnforcedStyle: explicit` enforces that direction;
# the default `inflected` would push the opposite way.
RSpec/PredicateMatcher:
  Enabled: true
  EnforcedStyle: explicit
  AutoCorrect: true

# Bans `@ivar`s in specs. Instance variables in test code are usually a
# symptom of state set up in a `before` and mutated across examples — the
# canonical source of `--order random` flake where the symptom (stale value)
# and the cause (cross-example object reuse) are separated. Local variables
# inside the `it` or `let`-bound values eliminate that surface entirely.
RSpec/InstanceVariable:
  Enabled: true
  Severity: warning

# Flags `let!`s whose only consumer is a `before` block — no `it` references
# the named binding. If nothing in the example uses the name, it shouldn't
# be a top-level named binding; it should be a local in the `before` (or
# inlined). Fewer apparent shared symbols across examples means less surface
# for the reader to wonder "does this example also depend on `foo`?"
RSpec/LetSetup:
  Severity: warning
  AutoCorrect: true

# Hooks declared after `it`s still run before them; the file-order mismatch
# misleads the reader. Setup must be visible above the example that depends
# on it, not below — otherwise scanning an `it` top-to-bottom doesn't tell
# the full story.
RSpec/HooksBeforeExamples:
  Severity: warning
  AutoCorrect: true

# Requires `let`s be grouped rather than interleaved with `it`s. Scattered
# `let`s fragment the setup story across the file; the reader has to scan
# the whole group to assemble the picture before any single `it` can be
# understood.
RSpec/ScatteredLet:
  Severity: warning
  AutoCorrect: true

# Multiple `before` hooks within one group fragment the setup story
# laterally — the same failure mode nested setup creates vertically. The
# reader has to mentally compose state from each sibling hook in declaration
# order before any `it` makes sense.
RSpec/ScatteredSetup:
  Enabled: true
  Severity: warning

# Bans `before(:all)` / `before(:context)`, which reuse Ruby object identity
# and DB rows across every example in the group. Mutation in one example
# leaks to the next, combining with stale stubs and association caches to
# produce `--order random` flake whose symptom and cause are separated by a
# transaction boundary that *looks* like it isolates state.
RSpec/BeforeAfterAll:
  Severity: warning

# Partial coverage for the `before(:once)` hazard: catches stub calls
# declared *inside* `before(:once)` blocks (the WebMock-state-leak slice of
# the broader object-reuse problem). The full `before(:once)` ban is
# intent-based and lives in the grader, not RuboCop — this cop catches the
# stub-specific subset statically.
Specs/NoBeforeOnceStubs:
  Enabled: true
