jobs_v2:
  state: allowed
  display_name: Jobs v2
  description: |-
    New and improved jobs control panel
  applies_to: SiteAdmin
feature_flag_test:
  state: allowed
  applies_to: SiteAdmin
  display_name: Test Feature Flag
  description: This flag is a no-op and is only intended for testing.
verify_ldap_certs:
  state: hidden
  shadow: true
  display_name: Verify LDAP TLS certificates
  description: Verify TLS certificates presented by LDAP authentication providers.
  applies_to: Account
login_registration_ui_identity:
  state: hidden
  applies_to: RootAccount
  display_name: New Canvas Login UI
  description: Enable the new Login/Registration UI.  This change is part of our ongoing transition to Instructure Identity Services and represents an important step in modernizing our authentication infrastructure.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
granular_authentication_provider_permissions:
  state: hidden
  applies_to: SiteAdmin
  display_name: Granular Authentication Provider Permissions
  description: |-
    Splits Authentication Provider management out of "Account Settings -
    manage" into dedicated "Authentication Providers - manage" and
    "Authentication Providers - read" permissions.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
force_login_after_logout:
  state: hidden
  applies_to: RootAccount
  display_name: Force Login After Delegated Logout
  description:
    After logging out of Canvas, instruct identity providers to re-authenticate the user on their next login attempt.
    This can prevent unexpected login loops.
site_admin_access_token_expiration:
  state: allowed_on
  shadow: true
  applies_to: SiteAdmin
  display_name: Site Admin Access Token Expiration
  description: >-
    Enforce expiration limits on access tokens issued to site admin users.
enforce_service_token_tenant_matching:
  state: hidden
  applies_to: SiteAdmin
  display_name: Enforce Service Token Tenant Matching
  description: |-
    Enforce that service tokens can only be used within the tenant they were issued for.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
allow_masquerade_without_all_permissions:
  state: hidden
  shadow: true
  applies_to: RootAccount
  display_name: Allow Masquerade Without All Permissions
  description: |-
    Allows an admin to masquerade as another user even if they don't have all the permissions that user has. Instead,
    the effective permissions will be an intersection of the admin and the target user.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
allow_site_admin_masquerade_without_all_permissions:
  state: hidden
  shadow: true
  applies_to: SiteAdmin
  display_name: Allow Masquerade Without All Permissions (Site Admin)
  description: |-
    Allows an admin whose pseudonym is in Site Admin to masquerade as another user even if they don't have all the
    permissions that user has. Instead, the effective permissions will be an intersection of the admin and the target
    user.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
new_login_ui_custom_labels:
  state: hidden
  applies_to: SiteAdmin
  display_name: "New Canvas Login UI: Custom Labels"
  description: Enable custom labels for the new Canvas Login/Registration UI.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
record_saml_certificates:
  state: hidden
  applies_to: SiteAdmin
  display_name: Record SAML Certificates
  description: >-
    Persist SAML signing certificates from authentication responses
    when using fingerprint-based certificate matching.
  environments:
    development:
      state: allowed
new_login_ui_identity_discovery_page:
  state: hidden
  applies_to: SiteAdmin
  display_name: "New Canvas Login UI: Identity Service Discovery Page"
  description: Enable Identity Service Discovery Page for the new Canvas Login/Registration UI.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
new_login_ui_identity_discovery_page_root_account:
  state: hidden
  shadow: true
  applies_to: RootAccount
  display_name: "New Canvas Login UI: Identity Service Discovery Page"
  description: >-
    Enable Identity Service Discovery Page for the new Canvas
    Login/Registration UI at the root account level.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
log_session_token_failures:
  state: hidden
  applies_to: SiteAdmin
  display_name: Log Session Token Failures
  description: |-
    If enabled, session token parsing and validation will emit events to DataDog
    when validation or parsing fails
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
block_session_token_for_user_generated_access_tokens_globally:
  state: hidden
  applies_to: SiteAdmin
  display_name: Block Session Token For User-Generated Access Tokens (Globally)
  description: |-
    When enabled, the /login/session_token endpoint rejects requests bearing
    access tokens created from the /profile/settings UI (DeveloperKey.default)
    for all users. These personal access tokens are an API-only artifact and
    should not be able to bootstrap a web browser session.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
block_session_token_for_user_generated_access_tokens_for_site_admins:
  state: hidden
  applies_to: SiteAdmin
  display_name: Block Session Token For User-Generated Access Tokens (Site Admins)
  description: |-
    When enabled, the /login/session_token endpoint rejects requests bearing
    access tokens created from the /profile/settings UI (DeveloperKey.default)
    for users who have read access to the site admin account.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
log_elevated_auth_provider_violations:
  state: hidden
  shadow: true
  applies_to: SiteAdmin
  display_name: Log Elevated Auth Provider Violations
  description: |-
    If enabled, requests that require an elevated authentication provider but
    are made with a different (or no) auth provider will emit a violation event
    to DataDog. The request itself is still allowed.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
enforce_no_elevated_auth_provider_violations:
  state: hidden
  shadow: true
  applies_to: SiteAdmin
  display_name: Enforce Elevated Auth Provider Requirement
  description: |-
    If enabled, requests that require an elevated authentication provider but
    are made with a different (or no) auth provider are blocked: html requests
    are redirected and json/api requests receive an unauthorized response.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
require_elevated_auth_provider_for_login_management:
  state: hidden
  shadow: true
  applies_to: SiteAdmin
  display_name: Require Elevated Auth Provider For Login Management
  description: |-
    If enabled, the elevated authentication provider requirement is checked
    on login (pseudonym) create, update, and destroy actions. Controlled
    independently from other elevated auth provider enforcement so it can be
    rolled out on its own.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
require_elevated_auth_provider_for_sessionless_launch:
  state: hidden
  shadow: true
  applies_to: SiteAdmin
  display_name: Require Elevated Auth Provider For Sessionless Launch
  description: |-
    If enabled, the elevated authentication provider requirement is checked
    on the sessionless launch endpoint. Controlled independently from other
    elevated auth provider enforcement so it can be rolled out on its own.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
require_elevated_auth_provider_for_plugins:
  state: hidden
  shadow: true
  applies_to: SiteAdmin
  display_name: Require Elevated Auth Provider For Plugin Management
  description: |-
    If enabled, all plugin management endpoints participate in the elevated
    auth provider requirement. When disabled the endpoints bypass the check
    entirely, regardless of the log/enforce flags.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
require_elevated_auth_provider_for_brand_configs:
  state: hidden
  shadow: true
  applies_to: SiteAdmin
  display_name: Require Elevated Auth Provider For Brand Config Management
  description: |-
    If enabled, all brand config management endpoints participate in the
    elevated auth provider requirement. When disabled the endpoints bypass
    the check entirely, regardless of the log/enforce flags.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
require_elevated_auth_provider_for_csp_settings:
  state: hidden
  shadow: true
  applies_to: SiteAdmin
  display_name: Require Elevated Auth Provider For CSP Settings
  description: |-
    If enabled, all CSP settings endpoints participate in the elevated auth
    provider requirement. When disabled the endpoints bypass the check
    entirely, regardless of the log/enforce flags.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
require_client_credentials_for_elevated_operations:
  state: hidden
  shadow: true
  applies_to: SiteAdmin
  display_name: Permit Client Credentials Elevated Operations
  description: |-
    If enabled, OAuth2 service-auth keys (service_user_client_credentials
    grant) may bypass the elevated authentication provider requirement when
    their scopes include the matching elevated-operation scope. When
    disabled, no developer key receives this bypass via scopes.
  environments:
    development:
      state: allowed
    beta:
      state: hidden
    production:
      state: hidden
